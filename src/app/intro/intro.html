<section class="about-me default-background">
  <div class="content">
    <div class="resume-main-info">
      <div class="badge">
        <span class="dot"></span>
        {{ 'intro.tooltip' | translate }}
      </div>

      <h1 class="title" [innerHTML]="'intro.name' | translate"></h1>

      <p class="subtitle">
        {{ 'intro.subtitle' | translate }}
      </p>

      <p class="description" [innerHTML]="'intro.description' | translate"></p>

      <div class="location">
        <fa-icon [icon]="faLocationDot"/>
        <span>{{ 'intro.location' | translate }}</span>
      </div>

      <a
        class="cv-button"
        [href]="'intro.cv.path' | translate"
        [attr.download]="'intro.cv.fileName' | translate"
        [attr.aria-label]="'intro.cv.ariaLabel' | translate"
      >
        <fa-icon [icon]="faDownload"/>
        <span>{{ 'intro.cv.label' | translate }}</span>
      </a>

      <div class="social-links">
        <a aria-label="Email link" class="icon-button" [href]="'mailto:' + ('intro.mail' | translate)"
           target="_blank" rel="noopener noreferrer">
          <fa-icon [icon]="faEnvelope"/>
        </a>

        <a aria-label="GitHub link" class="icon-button" [href]=" 'intro.gitHub' | translate" target="_blank"
           rel="noopener noreferrer">
          <fa-icon [icon]="faGithub"/>
        </a>

        <a aria-label="LinkedIn link" class="icon-button" [href]=" 'intro.linkedIn' | translate" target="_blank"
           rel="noopener noreferrer">
          <fa-icon [icon]="faLinkedin"/>
        </a>

        <a aria-label="Google Scholar link" class="icon-button" [href]=" 'intro.googleScholar' | translate"
           target="_blank"
           rel="noopener noreferrer">
          <fa-icon [icon]="faGoogleScholar"/>
        </a>
      </div>

    </div>

    <div class="image">
      <img
        [src]="'intro.profilePicture.path' | translate"
        [alt]="'intro.profilePicture.alt' | translate"
      >
    </div>
  </div>

</section>
