<section class="about-me">

  <div class="content">

    <div class="badge">
      <span class="dot"></span>
      {{('intro.tooltip' | translate)}}
    </div>

    <h1 class="title" [innerHTML]="('intro.name' | translate) | safeHtml"></h1>

    <p class="subtitle">
      {{ ('intro.subtitle' | translate) }}
    </p>

    <p class="description">{{ 'intro.description' | translate }}</p>

    <div class="location">
      <fa-icon [icon]="faLocationDot"/>
      <span>{{ 'intro.location' | translate }}</span>
    </div>

    <div class="social-links">
      <a class="icon-button" href="mailto:{{'intro.mail' | translate}}">
        <fa-icon [icon]="faEnvelope"/>
      </a>

      <a class="icon-button" href="{{ 'intro.gitHub' | translate}}">
        <fa-icon [icon]="faGithub"/>
      </a>

      <a class="icon-button" href="{{ 'intro.linkedIn' | translate}}">
        <fa-icon [icon]="faLinkedin"/>
      </a>

      <a class="icon-button" href="{{ 'intro.googleScholar' | translate}}">
        <fa-icon [icon]="faGoogleScholar"/>
      </a>
    </div>

  </div>

  <div class="image">
    <img
      [src]="('intro.profilePicture.path' | translate)"
      [alt]="('intro.profilePicture.alt' | translate)"
    >
  </div>

</section>
