<section class="about-section" id="about">

  <app-infocard [icon]="faUser" title="{{ 'sections.about.aboutMe.title' | translate }}">
    <div class="about-card main-card">
      @for (paragraph of ('sections.about.aboutMe.description' | translate); track $index) {
        <p [innerHTML]="paragraph"></p>
      }
    </div>
  </app-infocard>
  <app-infocard [icon]="faWrench" title="{{ 'sections.about.skills.title' | translate }}">
    <div class="skills">
      <app-skill [skill]="skills['programmingLanguages']" [icon]="icons[skills['programmingLanguages'].id]"></app-skill>
      <div class="wide-screen">
        <div>
          <app-skill [skill]="skills['frontEnd']" [icon]="icons[skills['frontEnd'].id]"></app-skill>
          <app-skill [skill]="skills['cloudAndInfrastructure']"
                     [icon]="icons[skills['cloudAndInfrastructure'].id]"></app-skill>
        </div>
        <div>
          <app-skill [skill]="skills['backEnd']" [icon]="icons[skills['backEnd'].id]"></app-skill>
          <app-skill [skill]="skills['dataAndSearch']" [icon]="icons[skills['dataAndSearch'].id]"></app-skill>
        </div>
      </div>
      <div class="narrow-screen">
        <div>
          <app-skill [skill]="skills['frontEnd']" [icon]="icons[skills['frontEnd'].id]"></app-skill>
          <app-skill [skill]="skills['backEnd']" [icon]="icons[skills['backEnd'].id]"></app-skill>
          <app-skill [skill]="skills['cloudAndInfrastructure']"
                     [icon]="icons[skills['cloudAndInfrastructure'].id]"></app-skill>
          <app-skill [skill]="skills['dataAndSearch']" [icon]="icons[skills['dataAndSearch'].id]"></app-skill>
        </div>
      </div>
    </div>
    <app-skill [card]="false" [skill]="skills['engineeringTools']"
               [icon]="icons[skills['engineeringTools'].id]"></app-skill>

  </app-infocard>

  <div class="career-overview">
    <app-infocard [icon]="faGraduationCap" class="education"
                  title="{{ 'sections.about.careerOverview.education.title' | translate }}">
      <app-timeline
        [items]="educationTimelineItems">
      </app-timeline>

      <div class="details">
        <button class="details-button">
          {{ 'generalButtons.viewDetails' | translate }}
          <fa-icon [icon]="faUpRightAndDownLeftFromCenter"></fa-icon>
        </button>
      </div>
    </app-infocard>

    <app-infocard [icon]="faBriefCase" class="experience"
                  title="{{ 'sections.about.careerOverview.experience.title' | translate }}">
      <app-timeline
        [items]="professionalExperienceTimelineItems">
      </app-timeline>

      <div class="details">
        <button class="details-button">
          {{ 'generalButtons.viewDetails' | translate }}
          <fa-icon [icon]="faUpRightAndDownLeftFromCenter"></fa-icon>
        </button>
      </div>
    </app-infocard>
  </div>
</section>
