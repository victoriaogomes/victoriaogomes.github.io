<header>
  <div class="navbar">
    <p>Victória Gomes</p>

    <button matButton class="hamburger" [matMenuTriggerFor]="menu" [class.active]="isMenuOpen"
            aria-label="Toggle navigation">
      <fa-icon [icon]="faBars"></fa-icon>
    </button>

    <mat-menu #menu="matMenu">
      @for (item of navItems; track item.href) {
        <a [href]="item.href" mat-menu-item>{{ item.key | translate }}</a>
      }
    </mat-menu>

    <nav class="nav-links" [class.active]="isMenuOpen">
      @for (item of navItems; track item.href) {
        <a [href]="item.href">{{ item.key | translate }}</a>
      }
    </nav>
  </div>
</header>
