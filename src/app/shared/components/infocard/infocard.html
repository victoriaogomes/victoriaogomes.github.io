<div class="info-card" [class.hover-animation]="hoverAnimation">
  <div class="card-header">
    <div class="title">
      @if (icon) {
        <app-icon-badge [icon]="icon"></app-icon-badge>
      }
      <p>{{ title }}</p>
    </div>
    @if (externalLink) {
      <a [href]="externalLink">
        <fa-icon [icon]="faArrowUpRightFromSquare"></fa-icon>
      </a>
    }
  </div>

  @if (subtitle) {
    <span>{{ subtitle }}</span>
  }

  <ng-content></ng-content>

</div>
